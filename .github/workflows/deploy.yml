name: CD - Deploy to Azure VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Deploy via SSH to Azure
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_HOST_IP || secrets.SERVER_HOST_IP || secrets.DROPLET_HOST }}
          username: ${{ secrets.AZURE_USERNAME || 'azureuser' }}
          key: ${{ secrets.AZURE_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.DROPLET_SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            APP_DIR="/opt/proxy_docker"
            echo "🚀 [Deploy] Accès au dossier $APP_DIR..."

            if [ ! -d "$APP_DIR" ]; then
              echo "[-] Dossier $APP_DIR introuvable sur le serveur."
              exit 1
            fi

            cd "$APP_DIR"

            echo "📥 [Deploy] Récupération de la dernière version (Git Pull)..."
            git pull origin main

            echo "🔍 [Deploy] Validation de la configuration compose..."
            docker compose config --quiet

            echo "🐳 [Deploy] Reconstruction et redémarrage (sans down destructeur)..."
            docker compose up -d --build --remove-orphans

            echo "⏳ [Deploy] Attente du healthcheck de la passerelle (max 90s)..."
            for i in $(seq 1 18); do
              if docker inspect -f '{{.State.Health.Status}}' gateway-isp 2>/dev/null | grep -q healthy; then
                echo "✅ [Deploy] Passerelle saine après $((i * 5))s."
                break
              fi
              if [ "$i" -eq 18 ]; then
                echo "❌ [Deploy] La passerelle n'est pas devenue healthy après 90s."
                exit 1
              fi
              sleep 5
            done

            echo "🧹 [Deploy] Nettoyage des images orphelines de plus de 72h..."
            docker image prune -f --filter "until=72h" || true

            echo "✅ [Deploy] Déploiement Azure terminé avec succès !"
