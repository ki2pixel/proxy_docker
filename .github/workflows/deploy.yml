name: CD - Deploy to Azure VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate compose file
        run: |
          # Le runner n'a pas le .env : fournir des valeurs de validation
          # (le déploiement réel sur la VM utilisera le vrai .env)
          DASHBOARD_TOKEN=validation_token_32chars_minimum DASHBOARD_SECRET=validation_secret_32chars_minimum \
          docker compose --profile gw1 --profile gw1-pawns --profile gw1-honeygain --profile gw1-repocket --profile gw1-packetstream --profile gw1-wipter config --quiet

      - name: Deploy via SSH to Azure
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_HOST_IP || secrets.SERVER_HOST_IP || secrets.DROPLET_HOST }}
          username: ${{ secrets.AZURE_USERNAME || 'azureuser' }}
          key: ${{ secrets.AZURE_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.DROPLET_SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            APP_DIR="/opt/proxy_docker"
            echo "🚀 [Deploy] Accès au dossier $APP_DIR..."

            if [ ! -d "$APP_DIR" ]; then
              echo "[-] Dossier $APP_DIR introuvable sur le serveur."
              exit 1
            fi

            cd "$APP_DIR"

            echo "📥 [Deploy] Récupération de la dernière version (Git Fetch + Reset)..."
            git fetch origin main
            git reset --hard origin/main

            echo "🔨 [Deploy] Génération des assets versionnés (cache-busting)..."
            # Si node est dispo sur la VM, régénère les hashes ; sinon on garde
            # les fichiers dist/ commités (fallback garanti).
            if command -v node >/dev/null 2>&1; then
              node scripts/build-assets.mjs
            else
              echo "ℹ️ node absent sur la VM : utilisation des assets dist/ commités."
            fi

            echo "🔍 [Deploy] Validation de la configuration compose..."
            docker compose config --quiet

            echo "🐳 [Deploy] Reconstruction et redémarrage (sans down destructeur)..."
            # Active les profils gw{n} d'après ENABLED_GATEWAYS et les types d'après COMPOSE_PROFILES
            GATEWAYS=$(grep -E '^ENABLED_GATEWAYS=' .env | cut -d= -f2 | tr ',' ' ' | tr -d '"' || echo "1")
            COMPOSE_PROFILES_VAL=$(grep -E '^COMPOSE_PROFILES=' .env | cut -d= -f2 | tr -d '"' | tr ',' ' ' || echo "none")
            if [ "$COMPOSE_PROFILES_VAL" = "all" ]; then
              COMPOSE_PROFILES_VAL="wipter honeygain packetstream pawns repocket"
            elif [ "$COMPOSE_PROFILES_VAL" = "none" ]; then
              COMPOSE_PROFILES_VAL=""
            fi
            PROFILE_ARGS=""
            for g in $GATEWAYS; do
              PROFILE_ARGS="$PROFILE_ARGS --profile gw${g}"
              for t in $COMPOSE_PROFILES_VAL; do
                PROFILE_ARGS="$PROFILE_ARGS --profile gw${g}-${t}"
              done
            done
            # shellcheck disable=SC2086
            # --force-recreate : indispensable pour les providers en
            # network_mode: service:gateway-isp-{n} — si une passerelle est
            # recréée (build → nouvelle image), les providers restés inchangés
            # resteraient dans le namespace réseau orphelin de l'ancienne
            # passerelle (DNS mort, devices inactifs côté plateformes).
            # NB : COMPOSE_PROFILES_VAL est splitté sur les virgules (tr ','
            #     ' ') — sans cela, une liste "a,b" génère --profile gw1-a,b
            #     qui n'active AUCUN provider dans le modèle compose.
            docker compose $PROFILE_ARGS up -d --build --force-recreate --remove-orphans

            # La santé du tunnel dépend du proxy amont (credentials/session),
            # pas du code déployé : on attend le dashboard (indicateur de
            # déploiement réussi) et on SIGNALE la santé du gateway sans
            # bloquer le pipeline (un proxy expiré n'est pas une régression).
            echo "⏳ [Deploy] Attente du healthcheck du dashboard (max 90s)..."
            for i in $(seq 1 18); do
              if docker inspect -f '{{.State.Health.Status}}' isp-dashboard 2>/dev/null | grep -q healthy; then
                echo "✅ [Deploy] Dashboard sain après $((i * 5))s."
                break
              fi
              if [ "$i" -eq 18 ]; then
                echo "❌ [Deploy] Le dashboard n'est pas devenu healthy après 90s."
                exit 1
              fi
              sleep 5
            done

            echo "ℹ️ [Deploy] Santé de la passerelle 1 : $(docker inspect -f '{{.State.Health.Status}}' gateway-isp-1 2>/dev/null || echo 'inconnue')"
            echo "    (unhealthy = proxy amont indisponible — configurable via le dashboard ou sync_env.sh)"

            echo "🧹 [Deploy] Nettoyage des images orphelines de plus de 72h..."
            docker image prune -f --filter "until=72h" || true

            echo "✅ [Deploy] Déploiement Azure terminé avec succès !"
