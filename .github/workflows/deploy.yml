name: CD - Deploy to Microsoft Azure VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to Azure
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_HOST_IP || secrets.SERVER_HOST_IP || secrets.DROPLET_HOST }}
          username: ${{ secrets.AZURE_USERNAME || 'azureuser' }}
          key: ${{ secrets.AZURE_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.DROPLET_SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            APP_DIR="/opt/proxy_docker"
            echo "🚀 [Deploy] Accès au dossier $APP_DIR..."
            
            if [ ! -d "$APP_DIR" ]; then
              echo "[-] Dossier $APP_DIR introuvable sur le serveur."
              exit 1
            fi
            
            cd "$APP_DIR"
            
            echo "📥 [Deploy] Récupération de la dernière version (Git Pull)..."
            git pull origin main
            
            echo "🐳 [Deploy] Reconstruction et redémarrage des conteneurs Docker..."
            docker compose down --remove-orphans || true
            docker compose up -d --build
            
            echo "🧹 [Deploy] Nettoyage des images orphelines..."
            docker image prune -f
            
            echo "✅ [Deploy] Déploiement Azure terminé avec succès !"
