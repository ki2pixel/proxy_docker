    mem_limit: 96m
    cpus: 0.25
    pids_limit: 64
    logging: *default-logging

  # --------------------------------------------------------------------------
  # Caddy : Reverse Proxy TLS optionnel (profil "tls")
  # Activez avec : COMPOSE_PROFILES="tls" + DASHBOARD_DOMAIN défini
  # --------------------------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    container_name: isp-caddy
    restart: unless-stopped
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DASHBOARD_DOMAIN=${DASHBOARD_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dashboard
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 128
    logging: *default-logging

volumes:
  proxyrack_data_1:
    driver: local
  proxyrack_data_2:
    driver: local
  proxyrack_data_3:
    driver: local
  proxyrack_data_4:
    driver: local
  caddy_data:
  caddy_config:
