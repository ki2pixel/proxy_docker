# ==============================================================================
# Multi-Passerelles ISP : 4 gateway-isp parallèles (4 pools d'IP dédiés)
# ------------------------------------------------------------------------------
# Chaque passerelle gateway-isp-{n} possède son propre namespace réseau
# (tun0, 198.18.0.1/15, socat 127.0.0.1:23320, dnsproxy 127.0.0.1:53) — aucun
# conflit entre les 4 instances. Chaque pool de providers est rattaché à SA
# passerelle via network_mode: service:gateway-isp-{n}.
#
# Activation :
#   ENABLED_GATEWAYS="1,2,3,4"  -> profils gw1..gw4
#   COMPOSE_PROFILES="all"      -> profils des types de providers (inchangé)
#   docker compose --profile gw1 --profile gw2 --profile all up -d
#   (scripts/start.sh construit ces arguments automatiquement)
# ==============================================================================

x-logging: &default-logging
  driver: local
  options:
    max-size: "2m"
    max-file: "2"
    compress: "true"

x-gateway-healthcheck: &gateway-healthcheck
  test: ["CMD", "/usr/local/bin/healthcheck.sh"]
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  # --------------------------------------------------------------------------
  # Tableau de Bord Web & Contrôleur d'Orchestration ISP (multi-passerelles)
  # Accès : tunnel SSH local (ssh -L 8088:localhost:8088) ou Caddy si TLS
  # --------------------------------------------------------------------------
  dashboard:
    build:
      context: ./controller
      dockerfile: Dockerfile
    image: isp-dashboard:latest
    container_name: isp-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8088}:8080"
    environment:
      - PORT=8080
      - APP_DIR=/workspace
      - DASHBOARD_PORT=${DASHBOARD_PORT:-8088}
      - ENABLED_GATEWAYS=${ENABLED_GATEWAYS:-1}
      - ISP_PROXY_HOST=${ISP_PROXY_HOST:-}
      - ISP_PROXY_PORT=${ISP_PROXY_PORT:-}
      - ISP_PROXY_PROTOCOL=${ISP_PROXY_PROTOCOL:-socks5}
      - COMPOSE_PROFILES=${COMPOSE_PROFILES:-repocket}
      - DASHBOARD_TOKEN=${DASHBOARD_TOKEN:?DASHBOARD_TOKEN doit être défini dans .env}
      - DASHBOARD_SECRET=${DASHBOARD_SECRET:?DASHBOARD_SECRET doit être défini dans .env}
      - NODE_OPTIONS=--max-old-space-size=24
    mem_limit: 128m
    cpus: 0.2
    pids_limit: 128
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/workspace/docker-compose.yml:ro
      - ./.env:/workspace/.env
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --------------------------------------------------------------------------
  # Métriques Hôte (CPU / RAM) — sidecar léger
  # Monte /proc de l'hôte en read-only, aucun port exposé sur l'hôte.
  # Consommé par le dashboard (GET /api/metrics, cache SWR).
  # --------------------------------------------------------------------------
  metrics-host:
    build:
      context: ./metrics-host
      dockerfile: Dockerfile
    image: metrics-host:latest
    container_name: metrics-host
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
    mem_limit: 64m
    cpus: 0.1
    pids_limit: 64
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ==========================================================================
  # PASSERELLE 1 — Proxy 1 (bloc GW1_* du .env, fallback clés historiques)
  # ==========================================================================
  gateway-isp-1:
    build:
      context: ./gateway-isp
      dockerfile: Dockerfile
    image: gateway-isp:latest
    container_name: gateway-isp-1
    restart: unless-stopped
    profiles: ["gw1"]
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE # requis pour dnsproxy (port 53) et le binding des ports
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - ISP_PROXY_PROTOCOL=${GW1_ISP_PROXY_PROTOCOL:-${ISP_PROXY_PROTOCOL:-socks5}}
      - ISP_PROXY_HOST=${GW1_ISP_PROXY_HOST:-${ISP_PROXY_HOST:-}}
      - ISP_PROXY_PORT=${GW1_ISP_PROXY_PORT:-${ISP_PROXY_PORT:-}}
      - ISP_PROXY_USER=${GW1_ISP_PROXY_USER:-${ISP_PROXY_USER:-}}
      - ISP_PROXY_PASS=${GW1_ISP_PROXY_PASS:-${ISP_PROXY_PASS:-}}
      - LOGLEVEL=${GATEWAY_LOGLEVEL:-warning}
    mem_limit: 64m
    cpus: 0.40
    pids_limit: 128
    logging: *default-logging
    healthcheck: *gateway-healthcheck

  # --- Providers rattachés à la passerelle 1 (profil gw1 + type) ---
  # Proxyrack : désactivé (profil "never") — pas rentable, désactivé sur toutes
  # les VM. Reversibilité : supprimer le profil "never" pour le réactiver.
  proxyrack-1:
    build:
      context: ./proxyrack
      dockerfile: Dockerfile
    image: proxyrack-pop:latest
    container_name: proxyrack-1
    restart: unless-stopped
    profiles: ["never"]
    network_mode: "service:gateway-isp-1"
    depends_on:
      gateway-isp-1:
        condition: service_healthy
    environment:
      - UUID=${GW1_UUID:-${UUID:-}}
      - API_KEY=${GW1_API_KEY:-${API_KEY:-}}
      - DEVICE_NAME=${GW1_DEVICE_NAME:-${DEVICE_NAME:-Docker-ISP-1-Proxyrack}}
    volumes:
      - proxyrack_data_1:/app/data
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 64
    logging: *default-logging
    healthcheck:
      test: ["CMD", "pgrep", "-f", "script.js"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s

  honeygain-1:
    image: honeygain/honeygain:latest
    container_name: honeygain-1
    restart: unless-stopped
    profiles: ["gw1-honeygain"]
    network_mode: "service:gateway-isp-1"
    depends_on:
      gateway-isp-1:
        condition: service_healthy
    command: ["-tou-accept", "-email", "${GW1_HONEYGAIN_EMAIL:-${HONEYGAIN_EMAIL:-}}", "-pass", "${GW1_HONEYGAIN_PASSWORD:-${HONEYGAIN_PASSWORD:-}}", "-device", "${GW1_HONEYGAIN_DEVICE_NAME:-${HONEYGAIN_DEVICE_NAME:-Docker-ISP-1-Honeygain}}"]
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 64
    logging: *default-logging

  packetstream-1:
    image: packetstream/psclient:latest
    container_name: packetstream-1
    restart: unless-stopped
    profiles: ["gw1-packetstream"]
    network_mode: "service:gateway-isp-1"
    depends_on:
      gateway-isp-1:
        condition: service_healthy
    environment:
      - CID=${GW1_PACKETSTREAM_CID:-${PACKETSTREAM_CID:-}}
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 64
    logging: *default-logging

  pawns-1:
    image: iproyal/pawns-cli:latest
    container_name: pawns-1
    restart: unless-stopped
    profiles: ["gw1-pawns"]
    network_mode: "service:gateway-isp-1"
    depends_on:
      gateway-isp-1:
        condition: service_healthy
    command: ["-email=${GW1_PAWNS_EMAIL:-${PAWNS_EMAIL:-}}", "-password=${GW1_PAWNS_PASSWORD:-${PAWNS_PASSWORD:-}}", "-device-name=${GW1_PAWNS_DEVICE_NAME:-${PAWNS_DEVICE_NAME:-Docker-ISP-1-Pawns}}", "-accept-tos"]
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 64
    logging: *default-logging

  repocket-1:
    image: repocket/repocket:latest
    container_name: repocket-1
    restart: unless-stopped
    profiles: ["gw1-repocket"]
    network_mode: "service:gateway-isp-1"
    depends_on:
      gateway-isp-1:
        condition: service_healthy
    environment:
      - RP_EMAIL=${GW1_REPOCKET_EMAIL:-${REPOCKET_EMAIL:-}}
      - RP_API_KEY=${GW1_REPOCKET_API_KEY:-${REPOCKET_API_KEY:-}}
      - NODE_OPTIONS=--max-old-space-size=24
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 64
    logging: *default-logging

  # ==========================================================================
  # PASSERELLE 2 — Proxy 2 (bloc GW2_* du .env)
  # ==========================================================================
