services:
  # --------------------------------------------------------------------------
  # Tableau de Bord Web & Contrôleur d'Orchestration ISP
  # Accès : tunnel SSH local (ssh -L 8088:localhost:8088) ou Caddy si TLS
  # --------------------------------------------------------------------------
  dashboard:
    build:
      context: ./controller
      dockerfile: Dockerfile
    image: isp-dashboard:latest
    container_name: isp-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8088}:8080"
    environment:
      - PORT=8080
      - APP_DIR=/workspace
      - DASHBOARD_PORT=${DASHBOARD_PORT:-8088}
      - ISP_PROXY_HOST=${ISP_PROXY_HOST:-}
      - ISP_PROXY_PORT=${ISP_PROXY_PORT:-}
      - ISP_PROXY_PROTOCOL=${ISP_PROXY_PROTOCOL:-socks5}
      - COMPOSE_PROFILES=${COMPOSE_PROFILES:-repocket}
      - DASHBOARD_TOKEN=${DASHBOARD_TOKEN:?DASHBOARD_TOKEN doit être défini dans .env}
      - DASHBOARD_SECRET=${DASHBOARD_SECRET:?DASHBOARD_SECRET doit être défini dans .env}
      - AUTO_ROTATE_SESSION=${AUTO_ROTATE_SESSION:-true}
      - AUTO_ROTATE_INTERVAL=${AUTO_ROTATE_INTERVAL:-50}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/workspace/docker-compose.yml:ro
      - ./.env:/workspace/.env
    depends_on:
      gateway-isp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --------------------------------------------------------------------------
  # Passerelle Dédiée ISP / Residential Gateway (tun2socks + DoH dnsproxy)
  # --------------------------------------------------------------------------
  gateway-isp:
    build:
      context: ./gateway-isp
      dockerfile: Dockerfile
    image: gateway-isp:latest
    container_name: gateway-isp
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE # requis pour dnsproxy (port 53) et le binding des ports
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - ISP_PROXY_PROTOCOL=${ISP_PROXY_PROTOCOL:-socks5}
      - ISP_PROXY_HOST=${ISP_PROXY_HOST:-}
      - ISP_PROXY_PORT=${ISP_PROXY_PORT:-}
      - ISP_PROXY_USER=${ISP_PROXY_USER:-}
      - ISP_PROXY_PASS=${ISP_PROXY_PASS:-}
      - LOGLEVEL=${GATEWAY_LOGLEVEL:-warning}
      - AUTO_ROTATE_SESSION=${AUTO_ROTATE_SESSION:-true}
      - AUTO_ROTATE_INTERVAL=${AUTO_ROTATE_INTERVAL:-50}
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # --------------------------------------------------------------------------
  # 1. Proxyrack PoP Client
  # --------------------------------------------------------------------------
  proxyrack:
    build:
      context: ./proxyrack
      dockerfile: Dockerfile
    image: proxyrack-pop:latest
    container_name: proxyrack-pop
    restart: unless-stopped
    profiles: ["proxyrack", "all"]
    network_mode: "service:gateway-isp"
    depends_on:
      gateway-isp:
        condition: service_healthy
    environment:
      - UUID=${UUID:-}
      - API_KEY=${API_KEY:-}
      - DEVICE_NAME=${DEVICE_NAME:-Docker-ISP-Proxyrack}
    volumes:
      - proxyrack_data:/app/data
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "pgrep", "-f", "script.js"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s

  # --------------------------------------------------------------------------
  # 2. Honeygain Client
  # --------------------------------------------------------------------------
  honeygain:
    image: honeygain/honeygain:latest
    container_name: honeygain
    restart: unless-stopped
    profiles: ["honeygain", "all"]
    network_mode: "service:gateway-isp"
    depends_on:
      gateway-isp:
        condition: service_healthy
    command: ["-tou-accept", "-email", "${HONEYGAIN_EMAIL}", "-pass", "${HONEYGAIN_PASSWORD}", "-device", "${HONEYGAIN_DEVICE_NAME:-Docker-ISP-Honeygain}"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # 3. PacketStream Client
  # --------------------------------------------------------------------------
  packetstream:
    image: packetstream/psclient:latest
    container_name: packetstream
    restart: unless-stopped
    profiles: ["packetstream", "all"]
    network_mode: "service:gateway-isp"
    depends_on:
      gateway-isp:
        condition: service_healthy
    environment:
      - CID=${PACKETSTREAM_CID:-}
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # 4. Pawns.app (IPRoyal) Client
  # --------------------------------------------------------------------------
  pawns:
    image: iproyal/pawns-cli:latest
    container_name: pawns
    restart: unless-stopped
    profiles: ["pawns", "pawns-app", "all"]
    network_mode: "service:gateway-isp"
    depends_on:
      gateway-isp:
        condition: service_healthy
    command: ["-email=${PAWNS_EMAIL}", "-password=${PAWNS_PASSWORD}", "-device-name=${PAWNS_DEVICE_NAME:-Docker-ISP-Pawns}", "-accept-tos"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # 5. Repocket Client
  # --------------------------------------------------------------------------
  repocket:
    image: repocket/repocket:latest
    container_name: repocket
    restart: unless-stopped
    profiles: ["repocket", "all"]
    network_mode: "service:gateway-isp"
    depends_on:
      gateway-isp:
        condition: service_healthy
    environment:
      - RP_EMAIL=${REPOCKET_EMAIL:-}
      - RP_API_KEY=${REPOCKET_API_KEY:-}
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Caddy : Reverse Proxy TLS optionnel (profil "tls")
  # Activez avec : COMPOSE_PROFILES="tls" + DASHBOARD_DOMAIN défini
  # --------------------------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    container_name: isp-caddy
    restart: unless-stopped
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DASHBOARD_DOMAIN=${DASHBOARD_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dashboard
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  proxyrack_data:
    driver: local
  caddy_data:
  caddy_config:
